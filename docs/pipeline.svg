<g class="up " style="animation-delay:1.90s"><rect class="stage" x="900" y="226" width="160" height="148" rx="10" fill="#fbf8f1" stroke="#1d1a16" stroke-width="1.5"/><text x="916" y="254" class="t" font-size="19" font-weight="700">Logistic</text><text x="916" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#4a443b">p = σ(w · x)</text><text x="916" y="301" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#4a443b">6 weights, public</text><text x="916" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#4a443b">x = [1, rank, A,</text><text x="916" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#4a443b">     B, D, young]</text></g>

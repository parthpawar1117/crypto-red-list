ly="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1d1a16">altcoin-season-index</text></g><g class="up" style="animation-delay:0.69s"><rect x="40" y="414" width="236" height="34" rx="17" fill="#fbf8f1" stroke="#1d1a16" stroke-opacity=".5"/><text x="56" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1d1a16">index/cmc100-latest</text></g><g class="up" style="animation-delay:0.76s"><rect x="40" y="460" width="236" height="34" rx="17" fill="#fbf8f1" stroke="#1d1a16" stroke-opacity=".5"/><text x="56" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1d1a16">index/cmc100-historical</text></g><g class="up" style="animation-delay:0.83s"><rect x="40" y="506" width="236" height="34" rx="17" fill="#fbf8f1" stroke="#1d1a16" stroke-opacity=".5"/><text x="56" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1d1a16">key/info</text></g>
<g class="up " style="animation-delay:1.00s"><rect class="stage" x="330" y="230" width="220" height="140" rx="10" fill="#fbf8f1" stroke="#1d1a16" stroke-width="1.5"/><text x="346" y="258" class="t" font-size="19" font-weight="700">Cache + ledger</text><text x="346" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#4a443b">shared server cache, 6 h ISR</text><text x="346" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#4a443b">stale copy if CMC fails</text><text x="346" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#4a443b">every call logged as</text><text x="346" y="347" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#4a443b">evidence: status, credits</text></g>

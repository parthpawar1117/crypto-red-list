<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="The Crypto Red List: an IUCN-style extinction-risk list for the top 500 cryptocurrencies">
<style>
  .t { font-family: Georgia, 'Times New Roman', serif; fill: #1d1a16; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #776f62; }
  .up   { animation: up .8s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade 1s ease both; }
  .pop  { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.3,1.6,.5,1) both; }
  .grow-x { transform-box: fill-box; transform-origin: left center; animation: growx 1.1s cubic-bezier(.2,.7,.2,1) both; }
  .grow-y { transform-box: fill-box; transform-origin: center bottom; animation: growy 1.2s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes up    { from { opacity: 0; transform: translateY(14px); } }
  @keyframes fade  { from { opacity: 0; } }
  @keyframes pop   { from { opacity: 0; transform: scale(.3); } }
  @keyframes growx { from { transform: scaleX(0); } }
  @keyframes growy { from { transform: scaleY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .motion { display: none; } }
  .wipe { animation: wipe 1.3s cubic-bezier(.7,0,.2,1) .25s both; }
  @keyframes wipe { from { transform: scaleX(0); } }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out 2s infinite; }
  @keyframes ring { 0% { opacity: .9; transform: scale(1); } 80%,100% { opacity: 0; transform: scale(2.1); } }
  .scan { animation: scan 6s linear 3s infinite; }
  @keyframes scan { from { transform: translateX(-80px); } to { transform: translateX(1220px); } }</style>
<rect width="1280" height="480" fill="#f4f0e6"/>
<line x1="0" y1="2" x2="1280" y2="2" stroke="#1d1a16" stroke-width="4"/>

<text x="70" y="86" class="m fade" font-size="19" letter-spacing="4">ASSESSMENT OF THE TOP 500 CRYPTOCURRENCIES · LIVE COINMARKETCAP DATA</text>
<clipPath id="title"><rect class="wipe" style="transform-box:fill-box;transform-origin:left" x="60" y="100" width="900" height="110"/></clipPath>
<text x="66" y="184" class="t" font-size="94" font-weight="700" letter-spacing="-3" clip-path="url(#title)">The Crypto Red List</text>
<text x="70" y="234" class="t up" style="animation-delay:0.90s" font-size="29" fill="#4a443b">Which coins are heading for extinction? Measured, not guessed.</text>
<circle class="ring motion" cx="100" cy="300" r="30" fill="none" stroke="#d81e05" stroke-width="3"/>
<g class="pop" style="animation-delay:1.10s"><circle cx="100" cy="300" r="30" fill="#d81e05" stroke="#1d1a16" stroke-opacity="1" stroke-width="2.5"/><text x="100" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#fff">CR</text></g><g class="pop" style="animation-delay:1.24s"><circle cx="174" cy="300" r="24" fill="#fc7f3f" stroke="#1d1a16" stroke-opacity="0.4" stroke-width="1"/><text x="174" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#1d1a16">EN</text></g><g class="pop" style="animation-delay:1.38s"><circle cx="248" cy="300" r="24" fill="#f9e814" stroke="#1d1a16" stroke-opacity="0.4" stroke-width="1"/><text x="248" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#1d1a16">VU</text></g><g class="pop" style="animation-delay:1.52s"><circle cx="322" cy="300" r="24" fill="#cce226" stroke="#1d1a16" stroke-opacity="0.4" stroke-width="1"/><text x="322" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#1d1a16">NT</text></g><g class="pop" style="animation-delay:1.66s"><circle cx="396" cy="300" r="24" fill="#60c659" stroke="#1d1a16" stroke-opacity="0.4" stroke-width="1"/><text x="396" y="306" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#1d1a16">LC</text></g>
<g class="up" style="animation-delay:1.60s"><text x="540" y="296" class="t" font-size="46" font-weight="700">5.1×</text><text x="540" y="326" class="m" font-size="15">riskiest tenth vs base rate</text></g><g class="up" style="animation-delay:1.78s"><text x="810" y="296" class="t" font-size="46" font-weight="700">8 of 10</text><text x="810" y="326" class="m" font-size="15">Nov 2022 picks that vanished</text></g><g class="up" style="animation-delay:1.96s"><text x="1080" y="296" class="t" font-size="46" font-weight="700">0.748</text><text x="1080" y="326" class="m" font-size="15">out-of-sample AUC</text></g>
<text x="70" y="372" class="m fade" style="animation-delay:1.90s" font-size="15" letter-spacing="1">NOV 2026 CENSUS · 500 COINS · 19 THREATENED</text>
<rect class="grow-x" style="animation-delay:2.00s" x="70.0" y="388" width="2.5" height="22" fill="#d81e05" stroke="#1d1a16" stroke-opacity=".35" stroke-width="1"/><rect class="grow-x" style="animation-delay:2.12s" x="72.3" y="388" width="16.0" height="22" fill="#fc7f3f" stroke="#1d1a16" stroke-opacity=".35" stroke-width="1"/><rect class="grow-x" style="animation-delay:2.24s" x="88.2" y="388" width="25.1" height="22" fill="#f9e814" stroke="#1d1a16" stroke-opacity=".35" stroke-width="1"/><rect class="grow-x" style="animation-delay:2.36s" x="113.3" y="388" width="41.0" height="22" fill="#cce226" stroke="#1d1a16" stroke-opacity=".35" stroke-width="1"/><rect class="grow-x" style="animation-delay:2.48s" x="154.4" y="388" width="811.7" height="22" fill="#60c659" stroke="#1d1a16" stroke-opacity=".35" stroke-width="1"/><rect class="grow-x" style="animation-delay:2.60s" x="966.0" y="388" width="63.8" height="22" fill="#b9b2a3" stroke="#1d1a16" stroke-opacity=".35" stroke-width="1"/><rect class="grow-x" style="animation-delay:2.72s" x="1029.9" y="388" width="180.1" height="22" fill="#ffffff" stroke="#1d1a16" stroke-opacity=".35" stroke-width="1"/>
<rect class="scan motion" x="70" y="384" width="60" height="30" fill="#fff" opacity=".35"/>
<text x="70" y="440" class="m fade" style="animation-delay:2.90s" font-size="14">CR 1  ·  EN 7  ·  VU 11  ·  NT 18  ·  LC 356  ·  DD 28  ·  NE 79</text>
</svg>
